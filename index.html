<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>결과물 하자 개선 요청서 시스템</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  :root{
    --primary:#102a4c; --primary-light:#1d3f6e; --accent:#b08d3f;
    --bg:#eef1f5; --card:#ffffff; --border:#dfe3ea;
    --danger:#c0392b; --text:#1c2430; --muted:#707a89;
  }
  *{box-sizing:border-box;}
  body{
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:var(--bg); margin:0; padding:0; color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  header{
    background:linear-gradient(135deg,var(--primary),var(--primary-light));
    color:#fff; padding:18px 20px 16px; border-bottom:3px solid var(--accent);
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  header .company{font-size:11px; letter-spacing:.06em; opacity:.75; font-weight:500;}
  header .title{font-size:17px; font-weight:700; margin-top:2px;}
  header .sub{font-size:12px; font-weight:400; opacity:.85; margin-top:4px;}
  header .link{color:#fff; opacity:.85;}
  .wrap{max-width:520px; margin:0 auto; padding:18px 16px 40px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:20px; margin-bottom:16px; box-shadow:0 2px 10px rgba(16,42,76,.06);
  }
  h2{font-size:16px; margin:0 0 14px; font-weight:700; color:var(--primary);}
  label{display:block; font-size:12.5px; color:var(--muted); margin:14px 0 5px; font-weight:500;}
  input,select,textarea{
    width:100%; padding:11px 12px; border:1px solid var(--border); border-radius:8px;
    font-size:15px; font-family:inherit; background:#fbfcfd; color:var(--text);
  }
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--primary-light); background:#fff;}
  textarea{min-height:90px; resize:vertical;}
  button{
    width:100%; padding:13px; border:none; border-radius:8px; background:var(--primary);
    color:#fff; font-size:15px; font-weight:700; margin-top:16px; cursor:pointer;
    letter-spacing:.01em; transition:background .15s;
  }
  button:hover{background:var(--primary-light);}
  button.secondary{background:#fff; color:var(--primary); border:1px solid var(--border);}
  button.secondary:hover{background:#f3f5f8;}
  button.small{width:auto; padding:8px 14px; font-size:13px; margin-top:0;}
  button:disabled{opacity:.5; cursor:default;}
  .hidden{display:none !important;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  .muted{color:var(--muted); font-size:13px;}
  .link{color:var(--primary-light); text-decoration:underline; cursor:pointer; font-size:13px;}
  table.list{width:100%; border-collapse:collapse; font-size:13px; margin-top:8px;}
  table.list th{
    background:#f3f5f9; color:var(--muted); font-weight:600; text-align:left;
    padding:9px 8px; border-bottom:1px solid var(--border);
  }
  table.list td{border-bottom:1px solid var(--border); padding:9px 8px; text-align:left;}
  table.list tr:last-child td{border-bottom:none;}
  .photo-grid{display:flex; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .photo-thumb{position:relative; width:72px; height:72px;}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
  .photo-thumb .rm{
    position:absolute; top:-6px; right:-6px; background:var(--danger); color:#fff;
    width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:12px; cursor:pointer;
  }
  .status{display:inline-block; padding:3px 9px; border-radius:10px; font-size:11px; font-weight:700;}
  .status.sent{background:#e3f7e8; color:#1e7e34;}
  .status.pending{background:#fff4e0; color:#b06d00;}
  .status.failed{background:#fde8e8; color:var(--danger);}
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#1c2430; color:#fff; padding:11px 18px; border-radius:8px; font-size:13px;
    display:none; z-index:999; max-width:90%; text-align:center; box-shadow:0 4px 16px rgba(0,0,0,.2);
  }
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .notice{
    background:#f3f5f9; border-left:3px solid var(--accent); padding:10px 12px;
    font-size:12px; color:var(--muted); border-radius:6px; margin-top:10px; line-height:1.5;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="company">주식회사 이랜드이츠</div>
    <div class="title">결과물 하자 개선 요청서</div>
    <div class="sub" id="storeBadge">매장 접속 필요</div>
  </div>
  <div class="link" id="logoutBtn" style="display:none;">나가기</div>
</header>

<div class="wrap">

  <!-- ================= 화면 0: 진입 ================= -->
  <div id="screen-entry" class="card">
    <h2>매장코드 입력</h2>
    <label>매장코드</label>
    <input id="entryCode" placeholder="예: SF-0921" autocomplete="off">
    <button onclick="enterStore()">접속</button>
    <div style="margin-top:16px; text-align:center;">
      <span class="link" onclick="showScreen('admin-login')">관리자 화면 (매장코드/수급사 관리)</span>
    </div>
  </div>

  <!-- ================= 관리자 로그인 ================= -->
  <div id="screen-admin-login" class="card hidden">
    <h2>관리자 인증</h2>
    <label>관리자 비밀번호</label>
    <input id="adminPw" type="password">
    <button onclick="adminLogin()">확인</button>
    <div style="margin-top:12px; text-align:center;">
      <span class="link" onclick="showScreen('entry')">뒤로</span>
    </div>
  </div>

  <!-- ================= 관리자 메뉴 ================= -->
  <div id="screen-admin" class="card hidden">
    <h2>관리자 메뉴</h2>
    <button onclick="showScreen('admin-store-new')">매장코드 생성</button>
    <button class="secondary" onclick="loadStoreList(); showScreen('admin-store-list')">매장 목록</button>
    <button class="secondary" onclick="loadSubList(); showScreen('admin-sub')">수급사 관리</button>
    <button class="secondary" onclick="loadAllHistory(); showScreen('admin-history')">전체 발송 이력</button>
  </div>

  <!-- ================= 매장코드 생성 ================= -->
  <div id="screen-admin-store-new" class="card hidden">
    <div class="topbar"><h2 style="margin:0;">매장코드 생성</h2><span class="link" onclick="showScreen('admin')">메뉴로</span></div>
    <label>브랜드</label>
    <select id="newBrand"></select>
    <label>매장명</label>
    <input id="newStoreName" placeholder="예: 스타필드시티 부천점">
    <label>매장 담당자명</label>
    <input id="newManagerName">
    <label>매장 담당자 이메일</label>
    <input id="newManagerEmail" type="email">
    <label>매장코드 (직접 지정, 미입력시 자동생성)</label>
    <input id="newStoreCode" placeholder="예: BUCHEON01">
    <button onclick="createStore()">생성</button>
  </div>

  <!-- ================= 매장 목록 ================= -->
  <div id="screen-admin-store-list" class="card hidden">
    <div class="topbar"><h2 style="margin:0;">매장 목록</h2><span class="link" onclick="showScreen('admin')">메뉴로</span></div>
    <table class="list" id="storeListTable">
      <thead><tr><th>코드</th><th>매장명</th><th>브랜드</th><th>담당자</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ================= 수급사 관리 ================= -->
  <div id="screen-admin-sub" class="card hidden">
    <div class="topbar"><h2 style="margin:0;">수급사 관리</h2><span class="link" onclick="showScreen('admin')">메뉴로</span></div>
    <table class="list" id="subListTable">
      <thead><tr><th>업체명</th><th>현장대리인</th><th>이메일</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <button onclick="openSubForm(null)">+ 수급사 추가</button>
  </div>

  <div id="screen-admin-sub-form" class="card hidden">
    <div class="topbar"><h2 style="margin:0;" id="subFormTitle">수급사 추가</h2><span class="link" onclick="loadSubList(); showScreen('admin-sub')">목록으로</span></div>
    <input type="hidden" id="subId">
    <label>업체명</label>
    <input id="subCompanyName">
    <label>현장대리인명</label>
    <input id="subManagerName">
    <label>이메일</label>
    <input id="subEmail" type="email">
    <button onclick="saveSub()">저장</button>
  </div>

  <!-- ================= 관리자: 전체 발송 이력 ================= -->
  <div id="screen-admin-history" class="card hidden">
    <div class="topbar"><h2 style="margin:0;">전체 발송 이력</h2><span class="link" onclick="showScreen('admin')">메뉴로</span></div>
    <table class="list" id="adminHistoryTable">
      <thead><tr><th>매장</th><th>수급사</th><th>수행일자</th><th>상태</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- ================= 매장 홈 (하자작성 / 이력) ================= -->
  <div id="screen-store-home" class="card hidden">
    <h2>메뉴</h2>
    <button onclick="openReportForm()">하자개선요청서 작성</button>
    <button class="secondary" onclick="loadHistory(); showScreen('store-history')">발송 이력</button>
  </div>

  <!-- ================= 하자 작성 폼 ================= -->
  <div id="screen-report-form" class="card hidden">
    <div class="topbar"><h2 style="margin:0;">하자개선요청서 작성</h2><span class="link" onclick="showScreen('store-home')">취소</span></div>

    <label>수급사 선택</label>
    <select id="reportSub" onchange="fillSubInfo()"></select>
    <div class="muted" id="subInfoPreview"></div>
    <div class="link" onclick="toggleSubEdit()" style="margin-top:6px;">매핑 정보 수정</div>
    <div id="subEditBox" class="hidden" style="margin-top:8px;">
      <label>수급인 회사명</label><input id="editCompanyName">
      <label>현장대리인명</label><input id="editManagerName">
      <label>수신 이메일</label><input id="editEmail" type="email">
    </div>

    <label>수행일자</label>
    <input id="reportWorkDate" type="date">

    <label>수행장소</label>
    <input id="reportLocation" readonly>

    <label>수행작업</label>
    <input id="reportWorkType" placeholder="예: 샐러드바 청소">

    <label>하자 개선 요청사항</label>
    <textarea id="reportDesc" placeholder="예: 업무범위와 관련된 개선 요청 - 다수의 오염 발생"></textarea>

    <label>사진 첨부 (최대 5장)</label>
    <input id="reportPhotos" type="file" accept="image/*" multiple capture="environment">
    <div class="photo-grid" id="photoPreview"></div>

    <button id="submitBtn" onclick="submitReport()">요청서 생성 및 발송</button>
    <div class="muted" id="submitStatus" style="margin-top:8px;"></div>
  </div>

  <!-- ================= 발송 이력 ================= -->
  <div id="screen-store-history" class="card hidden">
    <div class="topbar"><h2 style="margin:0;">발송 이력</h2><span class="link" onclick="showScreen('store-home')">메뉴로</span></div>
    <table class="list" id="historyTable">
      <thead><tr><th>수행일자</th><th>수급사</th><th>상태</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<div id="toast"></div>

<script>
/* ============================================================
   설정값 — 배포 전 반드시 채워넣을 것
   ============================================================ */
const SUPABASE_URL = "https://okujibesekhagmcpwqxt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1mLfctWo4PE4jUrwhAPSxA_lH9gebUB";
const EDGE_FUNCTION_URL = SUPABASE_URL + "/functions/v1/send-defect-email";
const ADMIN_ACTION_URL = SUPABASE_URL + "/functions/v1/admin-action";
const DOGUP_IN = "주식회사 이랜드이츠"; // 도급인 고정값
const MAIL_SUBJECT = "[이랜드이츠] 하자개선 요청서"; // 발송 메일 제목 고정값

const BRANDS = ["애슐리퀸즈","델리바이애슐리","리미니","자연별곡","피자몰","로운","프랑제리","프랜차이즈","카페"];

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   상태
   ============================================================ */
let currentStore = null;   // {id, store_code, store_name, brand, manager_name, manager_email}
let subcontractors = [];   // 캐시
let selectedPhotos = [];   // File[]
let adminPassword = null;  // 관리자 인증 후 메모리에만 보관 (Edge Function 검증용)

/* ============================================================
   공통 유틸
   ============================================================ */
function showScreen(name){
  document.querySelectorAll('[id^="screen-"]').forEach(el=>el.classList.add('hidden'));
  document.getElementById('screen-'+name).classList.remove('hidden');
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', 2800);
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function genStoreCode(brand){
  return (brand.slice(0,2) + '-' + Math.floor(1000+Math.random()*9000)).toUpperCase();
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   매장 진입
   ============================================================ */
async function enterStore(){
  const code = document.getElementById('entryCode').value.trim();
  if(!code){ toast('매장코드를 입력해줘'); return; }
  const { data, error } = await sb.from('stores').select('*').eq('store_code', code).maybeSingle();
  if(error || !data){ toast('존재하지 않는 매장코드야'); return; }
  currentStore = data;
  document.getElementById('storeBadge').textContent = `${data.brand} · ${data.store_name}`;
  document.getElementById('logoutBtn').style.display='block';
  await loadSubcontractorsCache();
  showScreen('store-home');
}
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  currentStore = null;
  document.getElementById('storeBadge').textContent = '매장 접속 필요';
  document.getElementById('logoutBtn').style.display='none';
  showScreen('entry');
});

/* ============================================================
   관리자
   ============================================================ */
async function callAdminAction(action, payload){
  const res = await fetch(ADMIN_ACTION_URL, {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY},
    body: JSON.stringify({ action, password: adminPassword, payload })
  });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

async function adminLogin(){
  const pw = document.getElementById('adminPw').value;
  try{
    const res = await fetch(ADMIN_ACTION_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY},
      body: JSON.stringify({ action: 'verify', password: pw })
    });
    if(!res.ok) throw new Error();
    adminPassword = pw;
    document.getElementById('adminPw').value = '';
    showScreen('admin');
  }catch(e){
    toast('비밀번호가 틀렸어');
  }
}

function initBrandSelect(){
  const sel = document.getElementById('newBrand');
  sel.innerHTML = BRANDS.map(b=>`<option value="${b}">${b}</option>`).join('');
}
initBrandSelect();

async function createStore(){
  const brand = document.getElementById('newBrand').value;
  const store_name = document.getElementById('newStoreName').value.trim();
  const manager_name = document.getElementById('newManagerName').value.trim();
  const manager_email = document.getElementById('newManagerEmail').value.trim();
  let store_code = document.getElementById('newStoreCode').value.trim();
  if(!store_name || !manager_name || !manager_email){ toast('필수 항목을 모두 입력해줘'); return; }
  if(!store_code) store_code = genStoreCode(brand);

  try{
    await callAdminAction('create_store', { store_code, store_name, brand, manager_name, manager_email });
  }catch(error){ toast('생성 실패: ' + error.message); return; }
  toast(`매장코드 생성 완료: ${store_code}`);
  document.getElementById('newStoreName').value='';
  document.getElementById('newManagerName').value='';
  document.getElementById('newManagerEmail').value='';
  document.getElementById('newStoreCode').value='';
}

async function loadStoreList(){
  const { data, error } = await sb.from('stores').select('*').order('created_at', {ascending:false});
  const tbody = document.querySelector('#storeListTable tbody');
  if(error){ tbody.innerHTML = `<tr><td colspan="4">조회 실패</td></tr>`; return; }
  tbody.innerHTML = data.map(s=>`<tr><td>${s.store_code}</td><td>${s.store_name}</td><td>${s.brand}</td><td>${s.manager_name}</td></tr>`).join('');
}

/* ---- 수급사 관리 ---- */
async function loadSubList(){
  const { data, error } = await sb.from('subcontractors').select('*').order('company_name');
  const tbody = document.querySelector('#subListTable tbody');
  if(error){ tbody.innerHTML = `<tr><td colspan="4">조회 실패</td></tr>`; return; }
  subcontractors = data;
  tbody.innerHTML = data.map(s=>`
    <tr>
      <td>${s.company_name}</td><td>${s.site_manager_name}</td><td>${s.email}</td>
      <td><span class="link" onclick='openSubForm(${JSON.stringify(s)})'>수정</span></td>
    </tr>`).join('');
}

function openSubForm(sub){
  document.getElementById('subFormTitle').textContent = sub ? '수급사 수정' : '수급사 추가';
  document.getElementById('subId').value = sub ? sub.id : '';
  document.getElementById('subCompanyName').value = sub ? sub.company_name : '';
  document.getElementById('subManagerName').value = sub ? sub.site_manager_name : '';
  document.getElementById('subEmail').value = sub ? sub.email : '';
  showScreen('admin-sub-form');
}

async function saveSub(){
  const id = document.getElementById('subId').value;
  const payload = {
    company_name: document.getElementById('subCompanyName').value.trim(),
    site_manager_name: document.getElementById('subManagerName').value.trim(),
    email: document.getElementById('subEmail').value.trim(),
    updated_at: new Date().toISOString()
  };
  if(!payload.company_name || !payload.site_manager_name || !payload.email){ toast('필수 항목을 입력해줘'); return; }

  try{
    await callAdminAction('save_subcontractor', id ? {...payload, id} : payload);
  }catch(error){ toast('저장 실패: ' + error.message); return; }
  toast('저장 완료');
  await loadSubList();
  showScreen('admin-sub');
}

/* ---- 관리자: 전체 발송 이력 ---- */
async function loadAllHistory(){
  const { data, error } = await sb
    .from('submissions')
    .select('*, stores(store_name, brand), subcontractors(company_name)')
    .order('created_at', {ascending:false});
  const tbody = document.querySelector('#adminHistoryTable tbody');
  if(error){ tbody.innerHTML = `<tr><td colspan="5">조회 실패</td></tr>`; return; }
  tbody.innerHTML = data.map(r=>{
    const label = r.email_status==='sent' ? '발송완료' : r.email_status==='failed' ? '발송실패' : '대기중';
    const storeLabel = r.stores ? `${r.stores.brand} (${r.stores.store_name})` : '-';
    return `<tr>
      <td>${storeLabel}</td>
      <td>${r.subcontractors?.company_name || '-'}</td>
      <td>${r.work_date}</td>
      <td><span class="status ${r.email_status}">${label}</span></td>
      <td>${r.document_url ? `<span class="link" onclick="downloadDoc('${r.document_url}')">문서</span>` : ''}</td>
    </tr>`;
  }).join('');
}

/* ============================================================
   매장 화면 — 하자 작성
   ============================================================ */
async function loadSubcontractorsCache(){
  const { data } = await sb.from('subcontractors').select('*').order('company_name');
  subcontractors = data || [];
}

function openReportForm(){
  const sel = document.getElementById('reportSub');
  sel.innerHTML = subcontractors.map(s=>`<option value="${s.id}">${s.company_name}</option>`).join('');
  document.getElementById('reportWorkDate').value = todayStr();
  document.getElementById('reportLocation').value = `${currentStore.brand} (${currentStore.store_name})`;
  document.getElementById('reportWorkType').value = '';
  document.getElementById('reportDesc').value = '';
  document.getElementById('subEditBox').classList.add('hidden');
  selectedPhotos = [];
  document.getElementById('photoPreview').innerHTML = '';
  document.getElementById('submitStatus').textContent = '';
  if(subcontractors.length) fillSubInfo();
  showScreen('report-form');
}

function fillSubInfo(){
  const id = document.getElementById('reportSub').value;
  const sub = subcontractors.find(s=>s.id===id);
  if(!sub) return;
  document.getElementById('subInfoPreview').textContent = `현장대리인: ${sub.site_manager_name} / 수신: ${sub.email}`;
  document.getElementById('editCompanyName').value = sub.company_name;
  document.getElementById('editManagerName').value = sub.site_manager_name;
  document.getElementById('editEmail').value = sub.email;
}
function toggleSubEdit(){
  document.getElementById('subEditBox').classList.toggle('hidden');
}

document.getElementById('reportPhotos').addEventListener('change', (e)=>{
  const files = Array.from(e.target.files).slice(0, 5 - selectedPhotos.length);
  selectedPhotos = selectedPhotos.concat(files).slice(0,5);
  renderPhotoPreview();
  e.target.value = '';
});
function renderPhotoPreview(){
  const box = document.getElementById('photoPreview');
  box.innerHTML = '';
  selectedPhotos.forEach((f, i)=>{
    const url = URL.createObjectURL(f);
    const div = document.createElement('div');
    div.className = 'photo-thumb';
    div.innerHTML = `<img src="${url}"><div class="rm" onclick="removePhoto(${i})">×</div>`;
    box.appendChild(div);
  });
}
function removePhoto(i){
  selectedPhotos.splice(i,1);
  renderPhotoPreview();
}

/* ---- 문서(.pdf) 생성 ----
   화면에 보일 양식을 화면 밖(off-screen)에 그려서 html2canvas로 캡처한 뒤
   jsPDF로 A4 페이지에 나눠 담는다. 한글은 브라우저가 그대로 렌더링하므로
   폰트 임베딩 없이도 깨지지 않는다. */
async function buildPdf(payload, photoFiles){
  const { jsPDF } = window.jspdf;

  const photoImgsHtml = photoFiles.map(f =>
    `<img src="${URL.createObjectURL(f)}" style="width:170px;height:128px;object-fit:cover;border:1px solid #dfe3ea;border-radius:4px;">`
  );
  const photosHtml = photoImgsHtml.length
    ? `<div style="display:flex;flex-wrap:wrap;gap:8px;">${photoImgsHtml.join('')}</div>`
    : `<div style="color:#888;">(첨부 사진 없음)</div>`;

  const th = 'background:#f0f2f6;color:#1c2430;font-weight:700;padding:12px 14px;width:26%;border:1px solid #dfe3ea;vertical-align:top;';
  const td = 'padding:12px 14px;border:1px solid #dfe3ea;';

  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-9999px';
  container.style.top = '0';
  container.style.width = '760px';
  container.style.background = '#ffffff';
  container.style.fontFamily = "'Noto Sans KR','Malgun Gothic',sans-serif";
  container.style.fontSize = '14px';
  container.style.color = '#1c2430';

  container.innerHTML = `
    <table style="width:100%;border-collapse:collapse;">
      <tr><td colspan="2" style="background:#102a4c;color:#fff;text-align:center;font-size:21px;font-weight:700;padding:20px;letter-spacing:.02em;">결과물 하자 개선 요청서</td></tr>
      <tr><td style="${th}">작성일자</td><td style="${td}">${escapeHtml(payload.writtenDate)}</td></tr>
      <tr><td style="${th}">도급인</td><td style="${td}">${escapeHtml(DOGUP_IN)}</td></tr>
      <tr><td style="${th}">수급인</td><td style="${td}">${escapeHtml(payload.companyName)}</td></tr>
      <tr><td style="${th}">현장대리인</td><td style="${td}">${escapeHtml(payload.siteManagerName)}</td></tr>
      <tr><td colspan="2" style="padding:12px 14px;font-size:12px;font-style:italic;color:#555;border:1px solid #dfe3ea;">※본 요청서는 귀사와 당사가 체결한 업무 도급 계약에 따른 결과물 하자 개선 요청서로, 본 요청서에 따른 업무 수행 및 결과물 개선이 이루어지지 않을 경우 제21조 등 계약상 관련 조항에 따른 조치가 진행될 수 있음을 숙지하여 주시기 바랍니다.</td></tr>
      <tr><td style="${th}">1. 수행일자</td><td style="${td}">${escapeHtml(payload.workDate)}</td></tr>
      <tr><td style="${th}">2. 수행장소</td><td style="${td}">${escapeHtml(payload.workLocation)}</td></tr>
      <tr><td style="${th}">3. 수행작업</td><td style="${td}">${escapeHtml(payload.workType)}</td></tr>
      <tr><td style="${th}">4. 하자 개선 요청사항</td><td style="${td}">${escapeHtml(payload.description).replace(/\n/g,'<br>')}</td></tr>
      <tr><td style="${th}">5. 사진</td><td style="${td}">${photosHtml}</td></tr>
    </table>
  `;
  document.body.appendChild(container);

  await Promise.all(Array.from(container.querySelectorAll('img')).map(img =>
    img.complete ? Promise.resolve() : new Promise(res=>{ img.onload=res; img.onerror=res; })
  ));

  const canvas = await html2canvas(container, { scale: 2, backgroundColor: '#ffffff' });
  document.body.removeChild(container);

  const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = canvas.height * imgWidth / canvas.width;
  const imgData = canvas.toDataURL('image/jpeg', 0.92);

  let heightLeft = imgHeight;
  let position = 0;
  pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
  heightLeft -= pageHeight;
  while(heightLeft > 0){
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
  }

  return pdf.output('blob');
}

/* ---- 제출: 문서 생성 → Storage 업로드 → DB 기록 → 메일 발송 요청 ---- */
async function submitReport(){
  const subId = document.getElementById('reportSub').value;
  const workDate = document.getElementById('reportWorkDate').value;
  const workType = document.getElementById('reportWorkType').value.trim();
  const description = document.getElementById('reportDesc').value.trim();
  if(!subId || !workDate || !workType || !description){ toast('필수 항목을 모두 입력해줘'); return; }

  const companyName = document.getElementById('editCompanyName').value.trim();
  const siteManagerName = document.getElementById('editManagerName').value.trim();
  const subEmail = document.getElementById('editEmail').value.trim();

  const btn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('submitStatus');
  btn.disabled = true; statusEl.textContent = '문서 생성 중...';

  try{
    // 1) PDF 생성
    const blob = await buildPdf({
      writtenDate: todayStr(),
      companyName, siteManagerName,
      workDate, workLocation: `${currentStore.brand} (${currentStore.store_name})`,
      workType, description
    }, selectedPhotos);

    // 2) Storage 업로드 (문서 + 사진)
    statusEl.textContent = '업로드 중...';
    const stamp = Date.now();
    const docPath = `${currentStore.store_code}/${stamp}_요청서.pdf`;
    const { error: docErr } = await sb.storage.from('defect-reports').upload(docPath, blob, { contentType: 'application/pdf' });
    if(docErr) throw new Error('문서 업로드 실패: ' + docErr.message);

    const photoPaths = [];
    for(let i=0;i<selectedPhotos.length;i++){
      const p = `${currentStore.store_code}/${stamp}_photo${i+1}.jpg`;
      const { error: pErr } = await sb.storage.from('defect-reports').upload(p, selectedPhotos[i]);
      if(!pErr) photoPaths.push(p);
    }

    // 3) DB 기록
    statusEl.textContent = '이력 저장 중...';
    const { data: sub, error: insErr } = await sb.from('submissions').insert({
      store_id: currentStore.id,
      subcontractor_id: subId,
      work_date: workDate,
      work_location: `${currentStore.brand} (${currentStore.store_name})`,
      work_type: workType,
      defect_description: description,
      photo_urls: photoPaths,
      document_url: docPath,
      email_status: 'pending'
    }).select().single();
    if(insErr) throw new Error('이력 저장 실패: ' + insErr.message);

    // 4) 메일 발송 요청 (Edge Function)
    statusEl.textContent = '메일 발송 요청 중...';
    try{
      const res = await fetch(EDGE_FUNCTION_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/json', 'Authorization':'Bearer '+SUPABASE_ANON_KEY},
        body: JSON.stringify({
          submission_id: sub.id,
          to: subEmail,
          reply_to: currentStore.manager_email,
          subject: MAIL_SUBJECT,
          document_path: docPath
        })
      });
      if(!res.ok) throw new Error(await res.text());
      await sb.from('submissions').update({email_status:'sent'}).eq('id', sub.id);
      toast('요청서 생성 및 메일 발송 완료');
    }catch(mailErr){
      await sb.from('submissions').update({email_status:'failed', email_error: String(mailErr)}).eq('id', sub.id);
      toast('문서는 저장됐지만 메일 발송은 실패했어 (메일 설정 확인 필요)');
    }

    showScreen('store-home');
  }catch(err){
    toast(String(err.message || err));
  }finally{
    btn.disabled = false; statusEl.textContent = '';
  }
}

/* ============================================================
   발송 이력
   ============================================================ */
async function loadHistory(){
  const { data, error } = await sb
    .from('submissions')
    .select('*, subcontractors(company_name)')
    .eq('store_id', currentStore.id)
    .order('created_at', {ascending:false});
  const tbody = document.querySelector('#historyTable tbody');
  if(error){ tbody.innerHTML = `<tr><td colspan="4">조회 실패</td></tr>`; return; }
  tbody.innerHTML = data.map(r=>{
    const label = r.email_status==='sent' ? '발송완료' : r.email_status==='failed' ? '발송실패' : '대기중';
    return `<tr>
      <td>${r.work_date}</td>
      <td>${r.subcontractors?.company_name || '-'}</td>
      <td><span class="status ${r.email_status}">${label}</span></td>
      <td>${r.document_url ? `<span class="link" onclick="downloadDoc('${r.document_url}')">문서</span>` : ''}</td>
    </tr>`;
  }).join('');
}

async function downloadDoc(path){
  const { data, error } = await sb.storage.from('defect-reports').createSignedUrl(path, 60);
  if(error){ toast('다운로드 링크 생성 실패'); return; }
  window.open(data.signedUrl, '_blank');
}
